# reTerminal E1002 (écran e-paper couleur 7,3" 800x480) — configuration ESPHome
#
# Trois écrans, on passe de l'un à l'autre avec n'importe quel bouton :
#   0 = stats réseaux sociaux + citation du jour (écran par défaut)
#   1 = stats réseaux sociaux en grand
#   2 = citation de Confucius du jour en grand
#
# L'appareil se réveille toutes les ${sleep_minutes} min, lit e1002.json (produit par
# fetch_stats.py dans ce dépôt), ne redessine l'écran que si quelque chose a changé,
# puis se rendort pour économiser la batterie.
#
# Installation : copier secrets.yaml.example en secrets.yaml, y mettre le Wi-Fi, puis
#   esphome run reterminal-e1002.yaml

substitutions:
  data_url: "https://raw.githubusercontent.com/fowlc78/smalltv-stats/main/e1002.json"
  sleep_minutes: "30"

esphome:
  name: reterminal-e1002
  friendly_name: reTerminal E1002
  on_boot:
    priority: -100
    then:
      - script.execute: refresh

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0 # le port USB-C passe par un convertisseur série sur l'UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

http_request:
  verify_ssl: true
  timeout: 15s

json:

globals:
  - id: page
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_hash # empreinte de ce qui est affiché, pour ne pas redessiner inutilement
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: timer_wake
    type: bool
    initial_value: "false"
  - id: data_ok
    type: bool
    initial_value: "false"
  - id: need_draw
    type: bool
    initial_value: "false"
  - id: s_yt
    type: std::string
    initial_value: '"--"'
  - id: s_ytf
    type: std::string
    initial_value: '"--"'
  - id: s_tt
    type: std::string
    initial_value: '"--"'
  - id: s_ttf
    type: std::string
    initial_value: '"--"'
  - id: s_ig
    type: std::string
    initial_value: '"--"'
  - id: s_igf
    type: std::string
    initial_value: '"--"'
  - id: s_time
    type: std::string
    initial_value: '""'
  - id: s_quote
    type: std::string
    initial_value: '""'
  - id: s_ref
    type: std::string
    initial_value: '""'

deep_sleep:
  id: ds
  sleep_duration: ${sleep_minutes}min
  on_wake:
    - lambda: "id(timer_wake) = (cause == deep_sleep::WAKEUP_CAUSE_TIMER);"
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - pin:
          number: GPIO3
          allow_other_uses: true
        on_wake:
          - lambda: "id(page) = (id(page) + 1) % 3;"
      - pin:
          number: GPIO4
          allow_other_uses: true
        on_wake:
          - lambda: "id(page) = (id(page) + 1) % 3;"
      - pin:
          number: GPIO5
          allow_other_uses: true
        on_wake:
          - lambda: "id(page) = (id(page) + 1) % 3;"

# Les mêmes boutons, quand l'appareil est déjà réveillé
binary_sensor:
  - platform: gpio
    id: btn_a
    pin: { number: GPIO3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    filters: [delayed_on: 30ms]
    on_press:
      - script.execute: next_page
  - platform: gpio
    id: btn_b
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    filters: [delayed_on: 30ms]
    on_press:
      - script.execute: next_page
  - platform: gpio
    id: btn_c
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    filters: [delayed_on: 30ms]
    on_press:
      - script.execute: next_page

# Mesure de la batterie (pont diviseur activé par GPIO21)
switch:
  - platform: gpio
    id: battery_enable
    pin: GPIO21
    restore_mode: ALWAYS_ON

sensor:
  - platform: adc
    id: battery_voltage
    pin: GPIO1
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0

script:
  - id: next_page
    mode: single
    then:
      - lambda: |-
          id(page) = (id(page) + 1) % 3;
          id(timer_wake) = false;
      - script.execute: refresh

  - id: refresh
    mode: restart
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - lambda: "id(data_ok) = false;"
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: ${data_url}
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("e1002", "HTTP %d", response->status_code);
                          return;
                        }
                        id(data_ok) = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["q"].is<const char *>()) return false;
                          id(s_yt) = root["yt"] | "--";
                          id(s_ytf) = root["ytf"] | "--";
                          id(s_tt) = root["tt"] | "--";
                          id(s_ttf) = root["ttf"] | "--";
                          id(s_ig) = root["ig"] | "--";
                          id(s_igf) = root["igf"] | "--";
                          id(s_time) = root["t"] | "";
                          id(s_quote) = root["q"] | "";
                          id(s_ref) = root["r"] | "";
                          return true;
                        });
                on_error:
                  then:
                    - logger.log: "Lecture de e1002.json impossible"
      - component.update: battery_voltage
      - lambda: |-
          // Empreinte de ce que montre l'écran courant (l'heure de mise à jour n'en fait pas partie)
          uint32_t h = 2166136261u;
          auto mix = [&](const std::string &s) {
            for (unsigned char c : s) { h ^= c; h *= 16777619u; }
            h ^= 0xff; h *= 16777619u;
          };
          mix(std::string(1, (char) ('0' + id(page))));
          if (id(page) != 2) {
            mix(id(s_yt)); mix(id(s_ytf)); mix(id(s_tt));
            mix(id(s_ttf)); mix(id(s_ig)); mix(id(s_igf));
          }
          if (id(page) != 1) { mix(id(s_quote)); mix(id(s_ref)); }
          if (!id(data_ok)) {
            // Pas de données : on ne touche à l'écran que si quelqu'un vient d'appuyer ou d'allumer
            id(need_draw) = !id(timer_wake);
            if (id(need_draw)) id(last_hash) = 0;
          } else {
            id(need_draw) = !id(timer_wake) || h != id(last_hash);
            id(last_hash) = h;
          }
      - if:
          condition:
            lambda: "return id(need_draw);"
          then:
            - wait_until:
                condition:
                  lambda: "return !id(epaper).is_updating();"
                timeout: 90s
            - component.update: epaper
            - delay: 2s
            - wait_until:
                condition:
                  lambda: "return !id(epaper).is_updating();"
                timeout: 90s
            - delay: 1s
      - deep_sleep.enter: ds

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  # Texte courant
  - file: { type: gfonts, family: Inter, weight: 500 }
    id: f_small
    size: 18
    glyphs: &latin
      - " !\"%'()+,-./0123456789:;?"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
      - "«»ÀÂÇÈÉÊËÎÏÔÙÛŒàâçèéêëîïôùûüœ’…–—·"
      - " "
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: f_title
    size: 24
    glyphs: *latin
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: f_med
    size: 28
    glyphs: *latin
  # Grands chiffres
  - file: { type: gfonts, family: Inter, weight: 800 }
    id: f_num
    size: 64
    glyphs: &digits "0123456789 .,kM-"
  - file: { type: gfonts, family: Inter, weight: 800 }
    id: f_num_xl
    size: 92
    glyphs: *digits
  # Citation
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: f_quote_xl
    size: 50
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: f_quote_l
    size: 42
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: f_quote_m
    size: 34
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: f_quote_s
    size: 28
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: f_quote_xs
    size: 23
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500, italic: true }
    id: f_ref
    size: 26
    glyphs: *latin

display:
  - platform: epaper_spi
    id: epaper
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const Color BLACK(0, 0, 0), WHITE(255, 255, 255), RED(255, 0, 0);
      const Color YELLOW(255, 255, 0), BLUE(0, 0, 255), GREEN(0, 255, 0);
      const int W = 800, H = 480;
      it.fill(WHITE);

      struct Net { const char *name; Color bg; Color fg; const std::string *views; const std::string *subs; };
      const Net nets[3] = {
        {"YouTube", RED, WHITE, &id(s_yt), &id(s_ytf)},
        {"TikTok", BLACK, WHITE, &id(s_tt), &id(s_ttf)},
        {"Instagram", BLUE, WHITE, &id(s_ig), &id(s_igf)},
      };

      // Découpe un texte en lignes qui tiennent dans max_w pixels
      auto wrap = [&](const std::string &text, display::BaseFont *f, int max_w) {
        std::vector<std::string> lines;
        std::string line, word;
        auto width = [&](const std::string &s) {
          int x1, y1, w, h;
          it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          return w;
        };
        for (size_t i = 0; i <= text.size(); i++) {
          if (i < text.size() && text[i] != ' ') { word += text[i]; continue; }
          if (word.empty()) continue;
          std::string trial = line.empty() ? word : line + " " + word;
          if (!line.empty() && width(trial) > max_w) { lines.push_back(line); line = word; }
          else line = trial;
          word.clear();
        }
        if (!line.empty()) lines.push_back(line);
        return lines;
      };

      // Citation centrée entre y0 et y1, avec la plus grande police qui tient
      struct QFont { display::BaseFont *font; int line_h; };
      auto draw_quote = [&](int y0, int y1, const QFont *fonts, int n_fonts) {
        if (id(s_quote).empty()) {
          it.print(W / 2, (y0 + y1) / 2, id(f_med), BLACK, TextAlign::CENTER, "Connexion impossible");
          it.print(W / 2, (y0 + y1) / 2 + 36, id(f_small), BLACK, TextAlign::CENTER,
                   "Nouvel essai dans ${sleep_minutes} min, ou appuyez sur un bouton.");
          return;
        }
        const int ref_h = 40, max_w = W - 96;
        std::vector<std::string> lines;
        int line_h = 0;
        display::BaseFont *font = nullptr;
        for (int i = 0; i < n_fonts; i++) {
          font = fonts[i].font;
          line_h = fonts[i].line_h;
          lines = wrap(id(s_quote), font, max_w);
          if ((int) lines.size() * line_h + ref_h <= y1 - y0) break;
        }
        int total = (int) lines.size() * line_h + ref_h;
        int y = y0 + (y1 - y0 - total) / 2;
        if (y < y0) y = y0;
        for (auto &l : lines) {
          it.print(W / 2, y, font, BLACK, TextAlign::TOP_CENTER, l.c_str());
          y += line_h;
        }
        it.printf(W / 2, y + 8, id(f_ref), RED, TextAlign::TOP_CENTER, "Confucius, %s", id(s_ref).c_str());
      };

      // Pied de page : heure des données à gauche, batterie à droite
      auto footer = [&]() {
        if (!id(data_ok))
          it.print(16, H - 8, id(f_small), RED, TextAlign::BOTTOM_LEFT, "hors ligne");
        else
          it.printf(16, H - 8, id(f_small), BLACK, TextAlign::BOTTOM_LEFT, "maj %s", id(s_time).c_str());
        float v = id(battery_voltage).state;
        if (!std::isnan(v) && v > 2.8f) {
          int pct = (int) ((v - 3.30f) / (4.15f - 3.30f) * 100.0f + 0.5f);
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          it.printf(W - 16, H - 8, id(f_small), pct < 15 ? RED : BLACK, TextAlign::BOTTOM_RIGHT,
                    "batterie %d %%", pct);
        }
      };

      if (id(page) == 0) {
        // ---- Écran combiné : 3 cartes en haut, citation en dessous
        for (int i = 0; i < 3; i++) {
          const int x = 16 + i * 260, y = 14, w = 248, h = 200;
          it.filled_rectangle(x, y, w, h, nets[i].bg);
          it.filled_rectangle(x + 3, y + 44, w - 6, h - 47, WHITE);
          it.print(x + w / 2, y + 22, id(f_title), nets[i].fg, TextAlign::CENTER, nets[i].name);
          it.print(x + w / 2, y + 92, id(f_num), BLACK, TextAlign::CENTER, nets[i].views->c_str());
          it.print(x + w / 2, y + 144, id(f_small), BLACK, TextAlign::CENTER, "vues, dernière vidéo");
          it.printf(x + w / 2, y + 174, id(f_small), BLACK, TextAlign::CENTER, "%s abonnés", nets[i].subs->c_str());
        }
        const QFont fonts[] = {{id(f_quote_m), 42}, {id(f_quote_s), 35}, {id(f_quote_xs), 29}};
        draw_quote(226, 446, fonts, 3);
      } else if (id(page) == 1) {
        // ---- Stats en grand : une ligne par réseau
        it.print(16, 12, id(f_title), BLACK, TextAlign::TOP_LEFT, "Vues de la dernière vidéo");
        for (int i = 0; i < 3; i++) {
          const int x = 16, y = 54 + i * 132, w = 768, h = 120;
          it.filled_rectangle(x, y, w, h, nets[i].bg);
          it.filled_rectangle(x + 240, y + 3, w - 243, h - 6, WHITE);
          it.print(x + 120, y + h / 2, id(f_med), nets[i].fg, TextAlign::CENTER, nets[i].name);
          it.printf(x + 262, y + h / 2, id(f_med), BLACK, TextAlign::CENTER_LEFT, "%s abonnés", nets[i].subs->c_str());
          it.print(x + w - 22, y + h / 2, id(f_num_xl), BLACK, TextAlign::CENTER_RIGHT, nets[i].views->c_str());
        }
      } else {
        // ---- Citation du jour en grand
        it.print(W / 2, 30, id(f_title), RED, TextAlign::CENTER, "CONFUCIUS");
        it.filled_rectangle(W / 2 - 40, 52, 80, 3, RED);
        const QFont fonts[] = {{id(f_quote_xl), 62}, {id(f_quote_l), 52}, {id(f_quote_m), 42}, {id(f_quote_s), 35}};
        draw_quote(72, 440, fonts, 4);
      }
      footer();
