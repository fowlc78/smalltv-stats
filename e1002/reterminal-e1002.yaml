# reTerminal E1002 (écran e-paper couleur 7,3" 800x480) — configuration ESPHome
#
# Trois écrans, on passe de l'un à l'autre avec n'importe quel bouton :
#   0 = page du jour : passage des Entretiens de Confucius + relevé des réseaux (par défaut)
#   1 = relevé des réseaux sociaux en grand
#   2 = passage du jour seul, en grand
#
# L'appareil se réveille toutes les ${sleep_minutes} min, lit e1002.json (produit par
# fetch_stats.py dans ce dépôt), ne redessine l'écran que si quelque chose a changé,
# puis se rendort pour économiser la batterie.
#
# Installation : copier secrets.yaml.example en secrets.yaml, y mettre le Wi-Fi, puis
#   esphome run reterminal-e1002.yaml

substitutions:
  data_url: "https://raw.githubusercontent.com/fowlc78/smalltv-stats/main/e1002.json"
  sleep_minutes: "30"

esphome:
  name: reterminal-e1002
  friendly_name: reTerminal E1002
  on_boot:
    priority: -100
    then:
      - script.execute: refresh

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0 # le port USB-C passe par un convertisseur série sur l'UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

http_request:
  verify_ssl: true
  timeout: 15s

json:

globals:
  - id: page
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_hash # empreinte de ce qui est affiché, pour ne pas redessiner inutilement
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: timer_wake
    type: bool
    initial_value: "false"
  - id: data_ok
    type: bool
    initial_value: "false"
  - id: need_draw
    type: bool
    initial_value: "false"
  - id: s_yt
    type: std::string
    initial_value: '"--"'
  - id: s_ytf
    type: std::string
    initial_value: '"--"'
  - id: s_tt
    type: std::string
    initial_value: '"--"'
  - id: s_ttf
    type: std::string
    initial_value: '"--"'
  - id: s_ig
    type: std::string
    initial_value: '"--"'
  - id: s_igf
    type: std::string
    initial_value: '"--"'
  - id: s_time
    type: std::string
    initial_value: '""'
  - id: s_quote
    type: std::string
    initial_value: '""'
  - id: s_ref
    type: std::string
    initial_value: '""'
  - id: s_date
    type: std::string
    initial_value: '""'
  - id: s_hour
    type: std::string
    initial_value: '""'

deep_sleep:
  id: ds
  sleep_duration: ${sleep_minutes}min
  on_wake:
    - lambda: "id(timer_wake) = (cause == deep_sleep::WAKEUP_CAUSE_TIMER);"
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - pin:
          number: GPIO3
          allow_other_uses: true
        on_wake:
          - lambda: "id(page) = (id(page) + 1) % 3;"
      - pin:
          number: GPIO4
          allow_other_uses: true
        on_wake:
          - lambda: "id(page) = (id(page) + 1) % 3;"
      - pin:
          number: GPIO5
          allow_other_uses: true
        on_wake:
          - lambda: "id(page) = (id(page) + 1) % 3;"

# Les mêmes boutons, quand l'appareil est déjà réveillé
binary_sensor:
  - platform: gpio
    id: btn_a
    pin: { number: GPIO3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    filters: [delayed_on: 30ms]
    on_press:
      - script.execute: next_page
  - platform: gpio
    id: btn_b
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    filters: [delayed_on: 30ms]
    on_press:
      - script.execute: next_page
  - platform: gpio
    id: btn_c
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    filters: [delayed_on: 30ms]
    on_press:
      - script.execute: next_page

# Mesure de la batterie (pont diviseur activé par GPIO21)
switch:
  - platform: gpio
    id: battery_enable
    pin: GPIO21
    restore_mode: ALWAYS_ON

sensor:
  - platform: adc
    id: battery_voltage
    pin: GPIO1
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0

script:
  - id: next_page
    mode: single
    then:
      - lambda: |-
          id(page) = (id(page) + 1) % 3;
          id(timer_wake) = false;
      - script.execute: refresh

  - id: refresh
    mode: restart
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - lambda: "id(data_ok) = false;"
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: ${data_url}
                capture_response: true
                max_response_buffer_size: 8192
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("e1002", "HTTP %d", response->status_code);
                          return;
                        }
                        id(data_ok) = json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["q"].is<const char *>()) return false;
                          id(s_yt) = root["yt"] | "--";
                          id(s_ytf) = root["ytf"] | "--";
                          id(s_tt) = root["tt"] | "--";
                          id(s_ttf) = root["ttf"] | "--";
                          id(s_ig) = root["ig"] | "--";
                          id(s_igf) = root["igf"] | "--";
                          id(s_time) = root["t"] | "";
                          id(s_quote) = root["q"] | "";
                          id(s_ref) = root["r"] | "";
                          id(s_date) = root["d"] | "";
                          id(s_hour) = root["h"] | "";
                          return true;
                        });
                on_error:
                  then:
                    - logger.log: "Lecture de e1002.json impossible"
      - component.update: battery_voltage
      - lambda: |-
          // Empreinte de ce que montre l'écran courant (l'heure du relevé n'en fait pas partie)
          uint32_t h = 2166136261u;
          auto mix = [&](const std::string &s) {
            for (unsigned char c : s) { h ^= c; h *= 16777619u; }
            h ^= 0xff; h *= 16777619u;
          };
          mix(std::string(1, (char) ('0' + id(page))));
          mix(id(s_date));
          if (id(page) != 2) {
            mix(id(s_yt)); mix(id(s_ytf)); mix(id(s_tt));
            mix(id(s_ttf)); mix(id(s_ig)); mix(id(s_igf));
          }
          if (id(page) != 1) { mix(id(s_quote)); mix(id(s_ref)); }
          if (!id(data_ok)) {
            // Pas de données : on ne touche à l'écran que si quelqu'un vient d'appuyer ou d'allumer
            id(need_draw) = !id(timer_wake);
            if (id(need_draw)) id(last_hash) = 0;
          } else {
            id(need_draw) = !id(timer_wake) || h != id(last_hash);
            id(last_hash) = h;
          }
      - if:
          condition:
            lambda: "return id(need_draw);"
          then:
            - wait_until:
                condition:
                  lambda: "return !id(epaper).is_updating();"
                timeout: 90s
            - component.update: epaper
            - delay: 2s
            - wait_until:
                condition:
                  lambda: "return !id(epaper).is_updating();"
                timeout: 90s
            - delay: 1s
      - deep_sleep.enter: ds

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  # Deux familles, deux rôles : EB Garamond porte la voix (citation, date),
  # Inter porte les données (noms, chiffres, mentions).
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: g52
    size: 52
    glyphs: &latin
      - " !\"%'()+,-./0123456789:;?[]§"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
      - "«»ÀÂÇÈÉÊËÎÏÔÙÛŒàâçèéêëîïôùûüœ’…–—·"
      - " "
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: g44
    size: 44
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: g36
    size: 36
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: g30
    size: 30
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: g26
    size: 26
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: g22
    size: 22
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500 }
    id: g19
    size: 19
    glyphs: *latin
  - file: { type: gfonts, family: EB Garamond, weight: 500, italic: true }
    id: g_ref
    size: 24
    glyphs: *latin
  - file: { type: gfonts, family: Inter, weight: 500 }
    id: i_meta
    size: 16
    glyphs: *latin
  - file: { type: gfonts, family: Inter, weight: 500 }
    id: i_text
    size: 22
    glyphs: *latin
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: i_label
    size: 22
    glyphs: *latin
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: i_name
    size: 30
    glyphs: *latin
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: i_fig
    size: 30
    glyphs: &digits "0123456789 .,kM-–"
  - file: { type: gfonts, family: Inter, weight: 800 }
    id: i_fig_xl
    size: 88
    glyphs: *digits
  # Sceau « Lunyu » (titre chinois des Entretiens)
  - file: { type: gfonts, family: Noto Serif SC, weight: 700 }
    id: f_seal
    size: 24
    glyphs: "論語"

display:
  - platform: epaper_spi
    id: epaper
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      // Une page imprimée : fond blanc, encre noire, filets fins, et le rouge comme seule
      // couleur d'accent (référence de la citation, sceau, alertes). Le bleu ne sert qu'à
      // repérer Instagram dans le tableau.
      const Color BLACK(0, 0, 0), WHITE(255, 255, 255), RED(255, 0, 0), BLUE(0, 0, 255);
      const int W = 800, M = 40, R = W - M;  // marges gauche et droite
      it.fill(WHITE);

      // Une valeur manquante (« -- ») s'affiche comme un simple tiret
      auto val = [](const std::string &s) { return s == "--" || s.empty() ? std::string("–") : s; };
      struct Net { const char *name; Color ink; std::string views; std::string subs; };
      const Net nets[3] = {
        {"YouTube", RED, val(id(s_yt)), val(id(s_ytf))},
        {"TikTok", BLACK, val(id(s_tt)), val(id(s_ttf))},
        {"Instagram", BLUE, val(id(s_ig)), val(id(s_igf))},
      };

      auto text_width = [&](const std::string &s, display::BaseFont *f) {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        return w;
      };

      // Découpe un texte en lignes qui tiennent dans max_w pixels
      auto wrap = [&](const std::string &text, display::BaseFont *f, int max_w) {
        std::vector<std::string> lines;
        std::string line, word;
        for (size_t i = 0; i <= text.size(); i++) {
          if (i < text.size() && text[i] != ' ') { word += text[i]; continue; }
          if (word.empty()) continue;
          std::string trial = line.empty() ? word : line + " " + word;
          if (!line.empty() && text_width(trial, f) > max_w) { lines.push_back(line); line = word; }
          else line = trial;
          word.clear();
        }
        if (!line.empty()) lines.push_back(line);
        return lines;
      };

      // En-tête : la date à gauche, l'heure du relevé (ou une alerte) à droite, puis un filet
      auto masthead = [&]() {
        it.print(M, 42, id(g26), BLACK, TextAlign::BASELINE_LEFT,
                 id(s_date).empty() ? "reTerminal" : id(s_date).c_str());
        float v = id(battery_voltage).state;
        if (!id(data_ok))
          it.print(R, 42, id(i_meta), RED, TextAlign::BASELINE_RIGHT, "hors ligne");
        else if (!std::isnan(v) && v > 2.8f && v < 3.45f)
          it.print(R, 42, id(i_meta), RED, TextAlign::BASELINE_RIGHT, "batterie faible");
        else
          it.printf(R, 42, id(i_meta), BLACK, TextAlign::BASELINE_RIGHT, "relevé à %s", id(s_hour).c_str());
        it.filled_rectangle(M, 54, R - M, 2, BLACK);
      };

      // Citation alignée à gauche, centrée en hauteur entre y0 et y1, avec la plus grande
      // police qui tient. Si rien ne tient, on coupe et on termine par « … ».
      struct QFont { display::BaseFont *font; int line_h; };
      auto draw_quote = [&](int y0, int y1, const QFont *fonts, int n_fonts) {
        if (id(s_quote).empty()) {
          it.print(M, (y0 + y1) / 2 - 20, id(g36), BLACK, TextAlign::CENTER_LEFT, "Connexion impossible.");
          it.print(M, (y0 + y1) / 2 + 24, id(i_meta), BLACK, TextAlign::CENTER_LEFT,
                   "Nouvel essai dans ${sleep_minutes} min, ou appuyez sur un bouton.");
          return;
        }
        const int ref_h = 38, max_w = R - M;
        std::vector<std::string> lines;
        int line_h = 0, cap = 0;
        display::BaseFont *font = nullptr;
        for (int i = 0; i < n_fonts; i++) {
          font = fonts[i].font;
          line_h = fonts[i].line_h;
          cap = (y1 - y0 - ref_h) / line_h;
          lines = wrap(id(s_quote), font, max_w);
          if ((int) lines.size() <= cap) break;
        }
        if ((int) lines.size() > cap) {
          lines.resize(cap);
          std::string &last = lines.back();
          while (!last.empty() && text_width(last + " …", font) > max_w) {
            size_t sp = last.find_last_of(' ');
            last = sp == std::string::npos ? "" : last.substr(0, sp);
          }
          last += " …";
        } else if (lines.size() > 1 && lines.back().find(' ') == std::string::npos) {
          // Évite un mot seul sur la dernière ligne : on resserre un peu la colonne
          for (int w = max_w - 24; w > max_w - 240; w -= 24) {
            auto alt = wrap(id(s_quote), font, w);
            if (alt.size() != lines.size()) break;
            if (alt.back().find(' ') != std::string::npos) { lines = alt; break; }
          }
        }
        int total = (int) lines.size() * line_h + ref_h;
        int y = y0 + (y1 - y0 - total) / 2;
        for (auto &l : lines) {
          it.print(M, y, font, BLACK, TextAlign::TOP_LEFT, l.c_str());
          y += line_h;
        }
        it.print(M, y + 8, id(g_ref), RED, TextAlign::TOP_LEFT, id(s_ref).c_str());
      };

      masthead();
      if (id(page) == 0) {
        // ---- Page du jour : la citation mène, le relevé des réseaux suit en tableau
        const QFont fonts[] = {{id(g44), 52}, {id(g36), 44}, {id(g30), 37}, {id(g26), 32}, {id(g22), 27}, {id(g19), 24}};
        draw_quote(66, 280, fonts, 6);
        it.filled_rectangle(M, 292, R - M, 2, BLACK);
        it.print(560, 312, id(i_meta), BLACK, TextAlign::CENTER_RIGHT, "vues, dernière vidéo");
        it.print(R, 312, id(i_meta), BLACK, TextAlign::CENTER_RIGHT, "abonnés");
        for (int i = 0; i < 3; i++) {
          const int cy = 348 + i * 42;
          if (i > 0) it.filled_rectangle(M, cy - 21, R - M, 1, BLACK);
          it.filled_rectangle(M, cy - 6, 12, 12, nets[i].ink);
          it.print(M + 24, cy, id(i_label), BLACK, TextAlign::CENTER_LEFT, nets[i].name);
          it.print(560, cy, id(i_fig), BLACK, TextAlign::CENTER_RIGHT, nets[i].views.c_str());
          it.print(R, cy, id(i_text), BLACK, TextAlign::CENTER_RIGHT, nets[i].subs.c_str());
        }
      } else if (id(page) == 1) {
        // ---- Relevé en grand : une ligne par réseau, lisible de loin
        it.print(R, 76, id(i_meta), BLACK, TextAlign::CENTER_RIGHT, "vues de la dernière vidéo");
        for (int i = 0; i < 3; i++) {
          const int cy = 150 + i * 122;
          if (i > 0) it.filled_rectangle(M, cy - 61, R - M, 1, BLACK);
          it.filled_rectangle(M, cy - 26, 16, 16, nets[i].ink);
          it.print(M + 30, cy - 18, id(i_name), BLACK, TextAlign::CENTER_LEFT, nets[i].name);
          it.printf(M + 30, cy + 22, id(i_text), BLACK, TextAlign::CENTER_LEFT, "%s abonnés", nets[i].subs.c_str());
          it.print(R, cy, id(i_fig_xl), BLACK, TextAlign::CENTER_RIGHT, nets[i].views.c_str());
        }
      } else {
        // ---- La citation seule, avec le sceau « Lunyu » en bas à droite
        const QFont fonts[] = {{id(g52), 62}, {id(g44), 52}, {id(g36), 44}, {id(g30), 37}, {id(g26), 32}, {id(g22), 27}};
        draw_quote(66, 384, fonts, 6);
        it.filled_rectangle(R - 40, 392, 40, 64, RED);
        it.print(R - 20, 409, id(f_seal), WHITE, TextAlign::CENTER, "論");
        it.print(R - 20, 439, id(f_seal), WHITE, TextAlign::CENTER, "語");
      }
