name: Reconstruire les citations de Confucius

on:
  push:
    paths: ["e1002/build_confucius.py", ".github/workflows/e1002-quotes.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python e1002/build_confucius.py
      - name: Publier confucius.json
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add e1002/confucius.json
          git commit -m "Texte intégral des Entretiens (traduction Couvreur)" || exit 0
          git pull --rebase -q && git push
