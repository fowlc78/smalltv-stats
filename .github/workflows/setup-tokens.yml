name: Ajouter un jeton

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Échanger / vérifier puis chiffrer les jetons
        env:
          TOKENS_KEY: ${{ secrets.TOKENS_KEY }}
          IG_TOKEN_INIT: ${{ secrets.IG_TOKEN_INIT }}
          TIKTOK_AUTH_CODE: ${{ secrets.TIKTOK_AUTH_CODE }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python setup_tokens.py
      - name: Enregistrer tokens.enc
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add tokens.enc
          git commit -m "jetons mis à jour" || exit 0
          git pull --rebase -q && git push
