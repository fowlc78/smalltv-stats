name: Mise à jour des stats

on:
  schedule:
    - cron: "*/20 * * * *"   # toutes les 20 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Récupérer les vues et abonnés
        env:
          YT_CHANNEL_ID: UCKs8YklAKMayFMqYiRis0Dw
          TIKTOK_USER: avinathan
          TOKENS_KEY: ${{ secrets.TOKENS_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python fetch_stats.py
      - name: Publier stats.json
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json tokens.enc 2>/dev/null || git add stats.json
          git commit -m "stats $(date -u +%FT%TZ)" || exit 0
          git push
